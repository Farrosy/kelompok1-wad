basePath: /api
definitions:
  main.availabilityResponse:
    properties:
      available_slots:
        items:
          type: string
        type: array
      barber_id:
        type: integer
      date:
        type: string
      service_id:
        type: integer
    type: object
  main.barber:
    properties:
      available:
        type: boolean
      id:
        type: integer
      name:
        type: string
      rating:
        type: number
    type: object
  main.cashierQueueItem:
    properties:
      barber_id:
        type: integer
      barber_name:
        type: string
      booking_date:
        type: string
      booking_time:
        type: string
      chair_number:
        type: integer
      customer_name:
        type: string
      customer_phone:
        type: string
      duration_minutes:
        type: integer
      id:
        type: integer
      is_walk_in:
        type: boolean
      payment_method:
        type: string
      payment_status:
        type: string
      service_name:
        type: string
      started_at:
        type: string
      status:
        type: string
      ticket_code:
        type: string
      total_amount:
        type: number
    type: object
  main.cashierQueueResponse:
    properties:
      date:
        type: string
      queue:
        items:
          $ref: '#/definitions/main.cashierQueueItem'
        type: array
      server_time:
        description: Jam server, dipakai frontend untuk menghitung sisa waktu tombol
          Selesai/Batal.
        type: string
    type: object
  main.cashierSummaryResponse:
    properties:
      cash_count:
        type: integer
      date:
        type: string
      done:
        type: integer
      in_service:
        type: integer
      non_cash_count:
        type: integer
      revenue:
        type: number
      total_chairs:
        type: integer
      waiting:
        type: integer
    type: object
  main.createBookingRequest:
    properties:
      barber_id:
        type: integer
      booking_date:
        type: string
      booking_time:
        type: string
      customer_name:
        type: string
      customer_phone:
        type: string
      notes:
        type: string
      service_id:
        type: integer
    type: object
  main.createBookingResponse:
    properties:
      booking:
        $ref: '#/definitions/main.createdBooking'
      message:
        type: string
    type: object
  main.createReviewRequest:
    properties:
      booking_id:
        type: integer
      comment:
        type: string
      rating:
        type: integer
    type: object
  main.createdBooking:
    properties:
      id:
        type: integer
      payment_redirect_url:
        type: string
      payment_status:
        type: string
      status:
        type: string
      ticket_code:
        type: string
    type: object
  main.loginRequest:
    properties:
      identifier:
        type: string
      password:
        type: string
    type: object
  main.midtransNotification:
    properties:
      currency:
        type: string
      fraud_status:
        type: string
      gross_amount:
        type: string
      merchant_id:
        type: string
      order_id:
        type: string
      payment_type:
        type: string
      settlement_time:
        type: string
      signature_key:
        type: string
      status_code:
        type: string
      status_message:
        type: string
      transaction_id:
        type: string
      transaction_status:
        type: string
      transaction_time:
        type: string
    type: object
  main.midtransNotificationError:
    properties:
      error:
        type: string
    type: object
  main.midtransNotificationResponse:
    properties:
      message:
        type: string
    type: object
  main.myTicketsResponse:
    properties:
      active:
        $ref: '#/definitions/main.ticketBooking'
      history:
        items:
          $ref: '#/definitions/main.ticketBooking'
        type: array
      stats:
        $ref: '#/definitions/main.ticketStats'
      user:
        $ref: '#/definitions/main.registeredUser'
    type: object
  main.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  main.registeredUser:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  main.rescheduleBookingRequest:
    properties:
      booking_date:
        type: string
      booking_time:
        type: string
    type: object
  main.reviewListItem:
    properties:
      barber_name:
        type: string
      booking_id:
        type: integer
      comment:
        type: string
      created_at:
        type: string
      customer_name:
        type: string
      id:
        type: integer
      rating:
        type: integer
      service_name:
        type: string
    type: object
  main.service:
    properties:
      description:
        type: string
      duration_minutes:
        type: integer
      id:
        type: integer
      name:
        type: string
      price:
        type: number
    type: object
  main.ticketBooking:
    properties:
      barber_name:
        type: string
      barber_rating:
        type: number
      booking_date:
        type: string
      booking_time:
        type: string
      chair_number:
        type: integer
      duration_minutes:
        type: integer
      id:
        type: integer
      notes:
        type: string
      payment_expires_at:
        type: string
      payment_method:
        type: string
      payment_redirect_url:
        type: string
      payment_status:
        type: string
      price:
        type: number
      service_description:
        type: string
      service_name:
        type: string
      status:
        type: string
      ticket_code:
        type: string
      total_amount:
        type: number
    type: object
  main.ticketStats:
    properties:
      favorite_barber:
        type: string
      visits:
        type: integer
    type: object
  main.userBooking:
    properties:
      barber_id:
        type: integer
      barber_name:
        type: string
      booking_date:
        type: string
      booking_time:
        type: string
      chair_number:
        type: integer
      customer_name:
        type: string
      customer_phone:
        type: string
      duration_minutes:
        type: integer
      id:
        type: integer
      notes:
        type: string
      payment_expires_at:
        type: string
      payment_method:
        type: string
      payment_redirect_url:
        type: string
      payment_status:
        type: string
      price:
        type: number
      service_id:
        type: integer
      service_name:
        type: string
      status:
        type: string
      ticket_code:
        type: string
      total_amount:
        type: number
    type: object
  main.walkInRequest:
    properties:
      barber_id:
        type: integer
      customer_name:
        type: string
      customer_phone:
        type: string
      payment_method:
        type: string
      service_id:
        type: integer
    type: object
host: localhost:3000
info:
  contact: {}
  description: API untuk aplikasi Barber One
  title: Barber One API
  version: "1.0"
paths:
  /availability:
    get:
      parameters:
      - description: ID barber
        in: query
        name: barber_id
        required: true
        type: integer
      - description: Tanggal booking (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      - description: ID layanan
        in: query
        name: service_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.availabilityResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cek slot booking yang tersedia
      tags:
      - bookings
  /barbers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/main.barber'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Daftar barber
      tags:
      - barbers
  /bookings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/main.userBooking'
              type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Daftar booking user yang sedang login
      tags:
      - bookings
    post:
      consumes:
      - application/json
      description: Mengunci slot sementara selama 5 menit dan membuat sesi pembayaran
        Midtrans. Booking baru muncul di tiket dan berstatus Dikonfirmasi setelah
        pembayaran lunas. Jika waktu pembayaran habis, booking dibatalkan dan slot
        dibuka kembali.
      parameters:
      - description: Data booking
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.createBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.createBookingResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Membuat booking
      tags:
      - bookings
  /bookings/{id}/cancel:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID booking
        in: path
        name: id
        required: true
        type: integer
      - description: Jadwal baru (untuk reschedule)
        in: body
        name: body
        schema:
          $ref: '#/definitions/main.rescheduleBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Membatalkan atau mengubah jadwal booking milik user
      tags:
      - bookings
  /bookings/{id}/reschedule:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID booking
        in: path
        name: id
        required: true
        type: integer
      - description: Jadwal baru (untuk reschedule)
        in: body
        name: body
        schema:
          $ref: '#/definitions/main.rescheduleBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Membatalkan atau mengubah jadwal booking milik user
      tags:
      - bookings
  /cashier/bookings/{id}/cancel:
    patch:
      description: Mengubah booking Sedang Dilayani menjadi Batal sehingga kursi kosong
        kembali. Baru bisa setelah 10 menit sejak booking masuk kursi. Pembayaran
        tidak dikembalikan (hangus) dan tetap dihitung sebagai omzet.
      parameters:
      - description: ID booking
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.cashierQueueItem'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Batalkan pelanggan yang tidak datang
      tags:
      - cashier
  /cashier/bookings/{id}/finish:
    patch:
      description: Mengubah booking Sedang Dilayani menjadi Selesai sehingga kursi
        kosong kembali. Baru bisa setelah 30 menit sejak booking masuk kursi.
      parameters:
      - description: ID booking
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.cashierQueueItem'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Selesaikan layanan
      tags:
      - cashier
  /cashier/queue:
    get:
      description: 'Menampilkan booking lunas (online dan walk-in) pada tanggal tertentu,
        diurutkan berdasarkan jam. Booking yang Batal atau belum dibayar tidak ditampilkan.
        Status: Dikonfirmasi (menunggu jadwal), Sedang Dilayani (otomatis saat jadwal
        tiba), Selesai.'
      parameters:
      - description: Tanggal (YYYY-MM-DD), default hari ini
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.cashierQueueResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Daftar antrean kasir
      tags:
      - cashier
  /cashier/summary:
    get:
      description: Jumlah antrean menunggu, sedang dilayani, selesai, serta omzet
        dari transaksi Lunas pada tanggal tertentu.
      parameters:
      - description: Tanggal (YYYY-MM-DD), default hari ini
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.cashierSummaryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ringkasan dashboard kasir
      tags:
      - cashier
  /cashier/walk-in:
    post:
      consumes:
      - application/json
      description: Kasir mencatat pelanggan yang datang langsung. Pembayaran dilakukan
        di kasir (Tunai, QRIS, Debit, Transfer) sehingga transaksi langsung Lunas.
        Jam booking memakai jam sekarang (WIB), lalu booking langsung masuk kursi
        (Sedang Dilayani) kalau barber dan kursi kosong; kalau tidak, tetap Dikonfirmasi
        sampai ada kursi.
      parameters:
      - description: Data walk-in
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.walkInRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.cashierQueueItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tambah pelanggan walk-in
      tags:
      - cashier
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Kredensial
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout dan hapus sesi
      tags:
      - auth
  /my-tickets:
    get:
      description: Menampilkan booking aktif milik pengguna, termasuk status transaksi
        pembayaran.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.myTicketsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tiket aktif, riwayat kunjungan, dan statistik user yang login
      tags:
      - bookings
  /payments/midtrans/notification:
    post:
      consumes:
      - application/json
      description: Endpoint webhook publik untuk notifikasi transaksi Midtrans (Snap).
        Signature diverifikasi dengan SHA-512 dari order_id + status_code + gross_amount
        + MIDTRANS_SERVER_KEY. Status settlement dan capture dengan fraud_status accept
        menandai transaksi Lunas serta booking Dikonfirmasi; pending tetap Menunggu;
        deny, cancel, dan expire menandai Gagal serta membatalkan booking yang masih
        Menunggu. Status transaksi lain diabaikan dan tetap dibalas 200.
      parameters:
      - description: Payload notifikasi Midtrans
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.midtransNotification'
      produces:
      - application/json
      responses:
        "200":
          description: Notifikasi diproses atau status transaksi diabaikan
          schema:
            $ref: '#/definitions/main.midtransNotificationResponse'
        "400":
          description: Payload JSON tidak valid
          schema:
            $ref: '#/definitions/main.midtransNotificationError'
        "401":
          description: Signature tidak valid
          schema:
            $ref: '#/definitions/main.midtransNotificationError'
        "405":
          description: Metode selain POST tidak diizinkan
          schema:
            $ref: '#/definitions/main.midtransNotificationError'
        "500":
          description: Gagal memperbarui transaksi atau melepas slot booking
          schema:
            $ref: '#/definitions/main.midtransNotificationError'
        "503":
          description: Payment gateway belum dikonfigurasi
          schema:
            $ref: '#/definitions/main.midtransNotificationError'
      summary: Terima notifikasi pembayaran Midtrans
      tags:
      - payments
  /profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ambil profil user yang sedang login
      tags:
      - user
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Data registrasi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.registeredUser'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Registrasi user baru
      tags:
      - auth
  /reviews:
    get:
      description: Menampilkan daftar review bersama nama layanan dan barber yang
        direview. Bisa dibatasi per barber dengan query parameter barber_id.
      parameters:
      - description: Filter berdasarkan ID barber
        in: query
        name: barber_id
        type: integer
      - description: Filter berdasarkan ID booking
        in: query
        name: booking_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/main.reviewListItem'
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Daftar review
      tags:
      - reviews
    post:
      consumes:
      - application/json
      description: User yang login dapat menilai booking miliknya yang sudah berstatus
        Selesai dengan rating 1-5 dan komentar opsional. Satu booking hanya dapat
        direview satu kali.
      parameters:
      - description: Data review
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.createReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Buat review untuk booking yang selesai
      tags:
      - reviews
  /services:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/main.service'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Daftar layanan aktif
      tags:
      - services
