basePath: /api
definitions:
  main.availabilityResponse:
    properties:
      available_slots:
        items:
          type: string
        type: array
      barber_id:
        type: integer
      date:
        type: string
      service_id:
        type: integer
    type: object
  main.barber:
    properties:
      available:
        type: boolean
      id:
        type: integer
      name:
        type: string
      rating:
        type: number
    type: object
  main.createBookingRequest:
    properties:
      barber_id:
        type: integer
      booking_date:
        type: string
      booking_time:
        type: string
      customer_name:
        type: string
      customer_phone:
        type: string
      notes:
        type: string
      service_id:
        type: integer
    type: object
  main.createBookingResponse:
    properties:
      booking:
        $ref: '#/definitions/main.createdBooking'
      message:
        type: string
    type: object
  main.createdBooking:
    properties:
      id:
        type: integer
      payment_redirect_url:
        type: string
      payment_status:
        type: string
      status:
        type: string
      ticket_code:
        type: string
    type: object
  main.loginRequest:
    properties:
      identifier:
        type: string
      password:
        type: string
    type: object
  main.myTicketsResponse:
    properties:
      active:
        $ref: '#/definitions/main.ticketBooking'
      history:
        items:
          $ref: '#/definitions/main.ticketBooking'
        type: array
      stats:
        $ref: '#/definitions/main.ticketStats'
      user:
        $ref: '#/definitions/main.registeredUser'
    type: object
  main.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  main.registeredUser:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  main.rescheduleBookingRequest:
    properties:
      booking_date:
        type: string
      booking_time:
        type: string
    type: object
  main.service:
    properties:
      description:
        type: string
      duration_minutes:
        type: integer
      id:
        type: integer
      name:
        type: string
      price:
        type: number
    type: object
  main.ticketBooking:
    properties:
      barber_name:
        type: string
      barber_rating:
        type: number
      booking_date:
        type: string
      booking_time:
        type: string
      chair_number:
        type: integer
      duration_minutes:
        type: integer
      id:
        type: integer
      notes:
        type: string
      payment_method:
        type: string
      payment_status:
        type: string
      price:
        type: number
      service_description:
        type: string
      service_name:
        type: string
      status:
        type: string
      ticket_code:
        type: string
      total_amount:
        type: number
    type: object
  main.ticketStats:
    properties:
      favorite_barber:
        type: string
      visits:
        type: integer
    type: object
  main.userBooking:
    properties:
      barber_id:
        type: integer
      barber_name:
        type: string
      booking_date:
        type: string
      booking_time:
        type: string
      customer_name:
        type: string
      customer_phone:
        type: string
      duration_minutes:
        type: integer
      id:
        type: integer
      notes:
        type: string
      price:
        type: number
      service_id:
        type: integer
      service_name:
        type: string
      status:
        type: string
      ticket_code:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API untuk aplikasi Barber One
  title: Barber One API
  version: "1.0"
paths:
  /availability:
    get:
      parameters:
      - description: ID barber
        in: query
        name: barber_id
        required: true
        type: integer
      - description: Tanggal booking (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      - description: ID layanan
        in: query
        name: service_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.availabilityResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cek slot booking yang tersedia
      tags:
      - bookings
  /barbers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/main.barber'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Daftar barber
      tags:
      - barbers
  /bookings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/main.userBooking'
              type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Daftar booking user yang sedang login
      tags:
      - bookings
    post:
      consumes:
      - application/json
      parameters:
      - description: Data booking
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.createBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.createBookingResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Membuat booking
      tags:
      - bookings
  /bookings/{id}/cancel:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID booking
        in: path
        name: id
        required: true
        type: integer
      - description: Jadwal baru (untuk reschedule)
        in: body
        name: body
        schema:
          $ref: '#/definitions/main.rescheduleBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Membatalkan atau mengubah jadwal booking milik user
      tags:
      - bookings
  /bookings/{id}/reschedule:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID booking
        in: path
        name: id
        required: true
        type: integer
      - description: Jadwal baru (untuk reschedule)
        in: body
        name: body
        schema:
          $ref: '#/definitions/main.rescheduleBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Membatalkan atau mengubah jadwal booking milik user
      tags:
      - bookings
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Kredensial
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout dan hapus sesi
      tags:
      - auth
  /my-tickets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.myTicketsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tiket aktif, riwayat kunjungan, dan statistik user yang login
      tags:
      - bookings
  /profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Ambil profil user yang sedang login
      tags:
      - user
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Data registrasi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.registeredUser'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Registrasi user baru
      tags:
      - auth
  /services:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/main.service'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Daftar layanan aktif
      tags:
      - services
securityDefinitions:
  BearerAuth:
    description: 'Isi dengan: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
